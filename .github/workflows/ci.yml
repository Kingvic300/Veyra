name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typescript:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: veyra
          POSTGRES_PASSWORD: veyra
          POSTGRES_DB: veyra_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U veyra" --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:packages
      - run: npm run typecheck
      - run: npm test
        env:
          TEST_DATABASE_URL: postgres://veyra:veyra@localhost:5432/veyra_test
          TEST_REDIS_URL: redis://localhost:6379
      - run: npm run build -w @veyra/api -w @veyra/dashboard

  cairo:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chains/starknet/contracts
    steps:
      - uses: actions/checkout@v4
      - uses: software-mansion/setup-scarb@v1
        with:
          scarb-version: '2.21.0'
      - uses: foundry-rs/setup-snfoundry@v4
        with:
          starknet-foundry-version: '0.64.1'
      - run: scarb fmt --check
      - run: scarb build
      - run: snforge test
